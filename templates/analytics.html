<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & ML Metrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4">EGG Diagnostic Analytics & Model Metrics</h2>

        <div class="row g-4 mb-4">
            <!-- Risk Distribution Chart -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3 p-3">
                    <h5 class="card-title">Patient Risk Level Distribution</h5>
                    <canvas id="riskChart" height="200"></canvas>
                </div>
            </div>

            <!-- Model Training Performance -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3 p-3">
                    <h5 class="card-title">Student Model Accuracy Trend</h5>
                    <canvas id="accuracyChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/analytics-data')
            .then(response => response.json())
            .then(data => {
                // Risk Distribution Pie Chart
                const riskCtx = document.getElementById('riskChart').getContext('2d');
                new Chart(riskCtx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.risk_distribution),
                        datasets: [{
                            data: Object.values(data.risk_distribution),
                            backgroundColor: ['#198754', '#ffc107', '#fd7e14', '#dc3545']
                        }]
                    }
                });

                // Accuracy Line Chart
                const accCtx = document.getElementById('accuracyChart').getContext('2d');
                new Chart(accCtx, {
                    type: 'line',
                    data: {
                        labels: data.training_metrics.epochs,
                        datasets: [
                            {
                                label: 'Train Accuracy',
                                data: data.training_metrics.train_acc,
                                borderColor: '#0d6efd',
                                fill: false
                            },
                            {
                                label: 'Validation Accuracy',
                                data: data.training_metrics.val_acc,
                                borderColor: '#198754',
                                fill: false
                            }
                        ]
                    }
                });
            })
            .catch(err => console.error("Failed to load analytics data:", err));
    </script>
</body>
</html>
