{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-2">
    <h3 class="fw-bold mb-4">EGG Diagnostic Analytics & Model Metrics</h3>

    <div class="row g-4 mb-4">
        <!-- Risk Distribution Chart -->
        <div class="col-md-6">
            <div class="card card-ehr shadow-sm border-0 rounded-3 p-3 h-100">
                <h5 class="card-title fw-semibold mb-3">Patient Risk Level Distribution</h5>
                <div style="position: relative; height: 320px;">
                    <canvas id="riskChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Model Training Performance -->
        <div class="col-md-6">
            <div class="card card-ehr shadow-sm border-0 rounded-3 p-3 h-100">
                <h5 class="card-title fw-semibold mb-3">Student Model Accuracy Trend</h5>
                <div style="position: relative; height: 320px;">
                    <canvas id="accuracyChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js CDN (Loaded inside block content) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/analytics-data')
            .then(response => response.json())
            .then(data => {
                // 1. Risk Distribution Pie/Doughnut Chart
                const riskCanvas = document.getElementById('riskChart');
                if (riskCanvas && data.risk_distribution) {
                    new Chart(riskCanvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(data.risk_distribution),
                            datasets: [{
                                data: Object.values(data.risk_distribution),
                                backgroundColor: ['#10b981', '#f59e0b', '#f97316', '#ef4444']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                }

                // 2. Accuracy Line Chart
                const accCanvas = document.getElementById('accuracyChart');
                if (accCanvas && data.training_metrics) {
                    new Chart(accCanvas.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: data.training_metrics.epochs,
                            datasets: [
                                {
                                    label: 'Train Accuracy',
                                    data: data.training_metrics.train_acc,
                                    borderColor: '#0284c7',
                                    backgroundColor: '#0284c7',
                                    fill: false,
                                    tension: 0.2
                                },
                                {
                                    label: 'Validation Accuracy',
                                    data: data.training_metrics.val_acc,
                                    borderColor: '#10b981',
                                    backgroundColor: '#10b981',
                                    fill: false,
                                    tension: 0.2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    min: 0.5,
                                    max: 1.0
                                }
                            }
                        }
                    });
                }
            })
            .catch(err => console.error("Failed to load analytics data:", err));
    });
</script>
{% endblock %}
