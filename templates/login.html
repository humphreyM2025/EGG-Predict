{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center style="min-height: 80vh;">
  <div class="col-md-5">
    <div class="card card-ehr p-4">
      <div class="text-center mb-4">
        <i class="bi bi-hospital text-primary display-4"></i>
        <h3 class="fw-bold mt-2">Hospital Clinical Portal</h3>
        <p class="text-muted small">EGG Signal AI Diabetes Diagnostics</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label font-medium">Hospital Username</label>
          <input type="text" name="username" class="form-control" required placeholder="e.g. admin">
        </div>
        <div class="mb-3">
          <label class="form-label font-medium">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign In to Dashboard</button>
      </form>
      <div class="mt-3 text-center text-muted small">
        Demo Login: <code>admin</code> / <code>AdminPass123!</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
