{% extends 'base.html' %}
{% block content %}
<h3 class="fw-bold mb-3">New Patient EGG Acquisition & Analysis</h3>

<form method="POST" enctype="multipart/form-data">
  <div class="row g-4">
    <!-- Patient Info Section -->
    <div class="col-md-6">
      <div class="card card-ehr p-4">
        <h5 class="fw-bold mb-3 text-primary"><i class="bi bi-person-lines-fill"></i> Patient EHR Meta</h5>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label">Patient ID</label>
            <input type="text" name="patient_id" class="form-control" required placeholder="PT-10023">
          </div>
          <div class="col-6">
            <label class="form-label">Hospital Number</label>
            <input type="text" name="hospital_number" class="form-control" required placeholder="HOSP-8839">
          </div>
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-4">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" required value="45">
          </div>
          <div class="col-4">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select"><option>Male</option><option>Female</option></select>
          </div>
          <div class="col-4">
            <label class="form-label">Height (cm)</label>
            <input type="number" step="0.1" name="height" class="form-control" required value="175">
          </div>
          <div class="col-6">
            <label class="form-label">Weight (kg)</label>
            <input type="number" step="0.1" name="weight" class="form-control" required value="78">
          </div>
          <div class="col-6">
            <label class="form-label">Medication Status</label>
            <input type="text" name="medication_status" class="form-control" placeholder="Metformin, Antacids">
          </div>
        </div>
      </div>
    </div>

    <!-- EGG File Upload Section -->
    <div class="col-md-6">
      <div class="card card-ehr p-4">
        <h5 class="fw-bold mb-3 text-primary"><i class="bi bi-file-earmark-medical"></i> Upload EGG Dataset</h5>
        <p class="text-muted small">Upload digitized continuous EGG time-series stream (.csv or .xlsx).</p>
        
        <div class="border border-2 border-dashed rounded p-4 text-center bg-light mb-3">
          <i class="bi bi-cloud-arrow-up display-4 text-secondary"></i>
          <p class="mb-2">Select raw EGG signal file</p>
          <input type="file" name="dataset_file" class="form-control" accept=".csv, .xlsx" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-cpu"></i> Run Distilled AI Inference</button>
      </div>
    </div>
  </div>
</form>
{% endblock %}
